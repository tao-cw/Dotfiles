<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Route emoji to a single colour font so one column never mixes styles.

  Rationale: Alacritty (crossfont) resolves each glyph by walking FcFontSort()
  and taking the first font whose charset covers it.  With no rule, most emoji
  land in whatever text font happens to claim that codepoint, drawing
  monochrome outline glyphs, while the few nobody claims fall through to
  Twemoji and draw as colour bitmaps.  Two fonts in one column.

  Two parts:
    1. Adwaita Mono is stripped of U+1F000..U+1FAFF (the supplementary emoji
       plane).  It shipped 497 codepoints there and outranked Twemoji.
    2. Monospace text fonts are stripped of the symbol-block emoji below, so
       they too fall through to Twemoji.

  Families are matched with compare="contains" using the shortest fragment
  that covers a whole family, so every weight and variant (Fira Mono Medium,
  JetBrainsMono Nerd Font Propo, Noto Sans Mono CJK JP, ...) is handled by a
  single block instead of one block per variant.

  Guard rails:
    * target="scan" is GLOBAL (all apps, not just the terminal), so math,
      symbol and icon fonts are deliberately left untouched.  Their codepoints
      are load-bearing in maths docs and icon pickers.  Deliberately not
      stripped: NewComputerModernMath, STIX Two Math, Garamond-Math, Noto Sans
      Symbols (all weights), Font Awesome 7 Free, Noto Serif Tangut, Fira Slav,
      Monomakh Unicode, NKD04 Playing Card's Index, JoyPixels, Gentium Plus and
      Gentium Book Plus, and the colour fonts Twemoji, Twemoji Mozilla and
      Noto Color Emoji.
    * Only codepoints Twemoji actually covers are stripped.  Everything else
      keeps its current font, so nothing can fall to tofu or a worse glyph.

  Applied at fontindex time -> run `fc-cache -f` after editing.
  Alacritty resolves fonts at startup -> restart it.
  The codepoint sets below are frozen snapshots.  Edit this file directly to
  widen or narrow the scope, then run `fc-cache -f`.

  To revert: delete this file and run `fc-cache -f`.
-->
<fontconfig>

  <!-- Adwaita Mono: whole supplementary emoji plane (U+1F641 U+1F642 etc.) plus its symbol-block emoji.  75-twemoji.conf's own DejaVu strip stops at 0x1F640 and misses the first two -->
  <match target="scan">
    <test name="family" compare="contains"><string>Adwaita Mono</string></test>
    <edit name="charset" mode="assign" binding="same">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x231a</int><int>0x231b</int></range>
          <int>0x2328</int>
          <int>0x23cf</int>
          <range><int>0x23e9</int><int>0x23f3</int></range>
          <range><int>0x23f8</int><int>0x23fa</int></range>
          <int>0x2600</int>
          <int>0x2611</int>
          <int>0x261d</int>
          <range><int>0x2639</int><int>0x263a</int></range>
          <int>0x2640</int>
          <int>0x2642</int>
          <int>0x2660</int>
          <int>0x2663</int>
          <range><int>0x2665</int><int>0x2666</int></range>
          <int>0x267e</int>
          <int>0x2699</int>
          <int>0x269b</int>
          <range><int>0x26a0</int><int>0x26a1</int></range>
          <range><int>0x26aa</int><int>0x26ab</int></range>
          <int>0x2705</int>
          <int>0x2714</int>
          <int>0x2716</int>
          <int>0x271d</int>
          <int>0x2721</int>
          <range><int>0x2733</int><int>0x2734</int></range>
          <int>0x2744</int>
          <int>0x2747</int>
          <int>0x274c</int>
          <int>0x274e</int>
          <int>0x2764</int>
          <int>0x27a1</int>
          <int>0x27b0</int>
          <int>0x27bf</int>
          <range><int>0x2b05</int><int>0x2b07</int></range>
          <range><int>0x2b1b</int><int>0x2b1c</int></range>
          <int>0x2b50</int>
          <int>0x2b55</int>
          <range><int>0x1f000</int><int>0x1faff</int></range>
        </charset>
      </minus>
    </edit>
  </match>

