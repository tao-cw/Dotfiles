# vim:fileencoding=utf-8:foldmethod=marker

font_size 16.0
window_padding_width 4
notify_on_cmd_finish unfocused 10
scrollback_lines 10000
scrollback_pager_history_size 32
scrollback_pager nvim --cmd 'set eventignore=FileType' +'set laststatus=0' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

undercurl_style thick-sparse
strip_trailing_spaces smart
mouse_hide_wait -1

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME

# not set by the theme; kept outside the kitten-managed block so it overrides
url_color #7daea3
