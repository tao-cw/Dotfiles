# Electron/Chromium derive `prefers-color-scheme` from GtkSettings
# (gtk-theme-name), NOT from xdg-desktop-portal. On this box that resolves to
# "light" for two separate reasons, and both have to be addressed:
#
#   1. org.gnome.desktop.interface gtk-theme must be 'Adwaita', not
#      'Adwaita-Dark'. 'Adwaita-Dark' is not an installed theme
#      (/usr/share/themes holds only Default and Emacs), and Chromium treats any
#      theme name other than the default as "a custom theme" and reports
#      `prefers-color-scheme: light` -- so every Electron app renders light no
#      matter what the desktop says. GSettings overrides gtk-theme-name below,
#      so this one lives in dconf and cannot be fixed from here:
#        gsettings set org.gnome.desktop.interface gtk-theme Adwaita
#      With the default name Chromium falls through to the portal
#      (org.freedesktop.appearance color-scheme), which tracks gsettings live.
#
#   2. GTK3 only switches to its dark palette when gtk-application-prefer-dark-
#      theme is set, and nothing on a non-GNOME session sets it. That is what
#      this file provides.
#
# keep in sync with:
#   gsettings get org.gnome.desktop.interface color-scheme   -> 'prefer-dark'
#   gsettings get org.gnome.desktop.interface gtk-theme      -> 'Adwaita'
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
